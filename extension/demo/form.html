<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>模拟差旅报销单</title><link rel="stylesheet" href="form.css"></head><body>

<section><h2>事前申请</h2><table id="oTable6" class="excelDetailTable"><thead><tr><th class="detail_7_1_0">序号</th><th>费用说明</th></tr></thead><tbody></tbody></table></section>
