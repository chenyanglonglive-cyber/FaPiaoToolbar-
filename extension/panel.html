<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>报销事项助手</title><link rel="stylesheet" href="panel.css"></head>
<body><header><div class="title"><strong>报销事项助手</strong><span class="version" aria-label="当前版本 0.2.9">v0.2.9</span></div><button id="collapse" aria-expanded="true">收起</button></header>
<main id="body"><p class="hint">读取全部发票，自动覆盖费用事项。</p><button id="generate" class="primary">新建费用事项</button><p class="hint">匹配分组保留部门和成本中心。保存、提交请在原页面完成。</p>
<p id="status" role="status" aria-live="polite">准备就绪</p>
<section id="shared" hidden><h2>首行公共字段 <small id="shared-count"></small></h2><p id="first-row-hint" class="hint"></p><button id="apply-first-row" class="secondary" type="button">应用首行到所有</button><p id="shared-status" class="hint" role="status" aria-live="polite"></p></section>
<section id="outcome" hidden><h2>待补与跳过项</h2><ul id="pending"></ul><details id="logs"><summary>查看本次日志</summary><h2>费用事项与发票核算表</h2><p class="hint">每个事项列出对应发票，金额单位：元。表格可左右滚动查看票面与可抵扣税额；跳过的分组不会计入已填写事项。</p><div id="ledger"></div><details><summary>完整文字日志</summary><pre id="log"></pre></details></details><button id="download">下载日志</button></section>
</main><script type="module" src="panel.js"></script></body></html>
